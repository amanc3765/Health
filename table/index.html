<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Plan Table - Nutrition Breakdown</title>
    <link rel="stylesheet" href="../styles/main.css?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="dark-mode table-page">
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-main">
                <div class="header-branding">
                    <svg class="header-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z">
                        </path>
                        <line x1="6" y1="17" x2="18" y2="17"></line>
                    </svg>
                    <h1>Meal Planner</h1>
                </div>

                <!-- Navigation Tabs (Meal Plan Table is FIRST and DEFAULT) -->
                <nav class="app-nav-tabs" aria-label="Main Navigation">
                    <a href="index.html" class="nav-tab active" id="nav-table-tab" title="Meal Plan Table View">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                        <span>Meal Plan Table</span>
                    </a>
                    <a href="../index.html#planner" class="nav-tab" id="nav-planner-tab" title="Switch to Drag & Drop Board Planner">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Planner</span>
                    </a>
                </nav>

                <!-- Actions -->
                <div class="header-actions">
                    <a href="../index.html#planner" class="btn-secondary-action" title="Go to Interactive Planner">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                        <span>Back to Planner</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- Main Table View -->
        <main class="table-view-container">
            <!-- Toolbar -->
            <section class="table-toolbar">
                <div class="table-toolbar-left">
                    <div class="plan-select-wrapper">
                        <label for="table-plan-select">Select Meal Plan:</label>
                        <select id="table-plan-select" class="table-plan-select" aria-label="Select Meal Plan">
                            <option value="__current__">Current Active Plan</option>
                        </select>
                        <button id="btn-table-new-plan" class="action-btn" title="Create New Meal Plan" aria-label="Create Plan">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>New Meal Plan</span>
                        </button>
                    </div>

                    <button id="btn-table-add-food" class="btn-secondary-action">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        <span>Add Food</span>
                    </button>
                </div>

                <div class="table-toolbar-right">
                    <button id="btn-table-set-active" class="btn-secondary-action" style="display: none;" title="Set this saved plan as current active plan">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span>Set as Active</span>
                    </button>
                    <button id="btn-table-delete-plan" class="btn-danger-action" style="display: none;" title="Delete this saved plan">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span>Delete Plan</span>
                    </button>
                </div>
            </section>

            <!-- Table Container -->
            <section class="meal-plan-table-container">
                <div id="table-content-wrapper" class="table-scroll-wrapper">
                    <table class="meal-plan-table">
                        <thead>
                            <tr>
                                <th class="col-left col-food sortable" data-sort="food" title="Click to sort by Food">Food<span class="sort-indicator"></span></th>
                                <th class="col-weight sortable" data-sort="weight" title="Click to sort by Weight">Weight<span class="sort-indicator"></span></th>
                                <th class="col-cal sortable" data-sort="calories" title="Click to sort by Calories">Calories<span class="sort-indicator"></span></th>
                                <th class="col-pro sortable" data-sort="protein" title="Click to sort by Protein">Protein<span class="sort-indicator"></span></th>
                                <th class="col-carb sortable" data-sort="carbs" title="Click to sort by Carbs">Carbs<span class="sort-indicator"></span></th>
                                <th class="col-fat sortable" data-sort="fat" title="Click to sort by Fat">Fat<span class="sort-indicator"></span></th>
                                <th class="col-fiber sortable" data-sort="fiber" title="Click to sort by Fiber">Fiber<span class="sort-indicator"></span></th>
                                <th class="col-action"></th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Injected by TableRenderer -->
                        </tbody>
                        <tfoot id="table-foot">
                            <!-- Grand Totals injected by TableRenderer -->
                        </tfoot>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal: Create New Meal Plan -->
    <div id="table-create-plan-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Create New Meal Plan</h3>
            <div class="input-group">
                <label for="table-new-plan-name-input">Plan Name</label>
                <input type="text" id="table-new-plan-name-input" placeholder="e.g. High Protein Day 1">
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                <input type="checkbox" id="table-copy-active-plan-check" style="cursor: pointer;">
                <label for="table-copy-active-plan-check" style="font-size: var(--font-size-sm); color: var(--text-secondary); cursor: pointer;">
                    Copy foods from current active plan
                </label>
            </div>
            <div class="modal-actions">
                <button type="button" id="btn-cancel-create-table-plan" class="icon-btn">Cancel</button>
                <button type="button" id="btn-confirm-create-table-plan" class="action-btn">Create Plan</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add Food to Plan -->
    <div id="table-add-food-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Add Food to Meal Plan</h3>
            <div class="input-group">
                <label for="table-add-food-select">Select Food</label>
                <select id="table-add-food-select" class="table-plan-select">
                    <!-- Populated dynamically -->
                </select>
            </div>
            <div class="input-group">
                <label for="table-add-food-weight">Weight (grams)</label>
                <input type="number" id="table-add-food-weight" value="100" min="1" max="5000" step="1">
            </div>
            <div class="modal-actions">
                <button type="button" id="btn-cancel-table-add-food" class="icon-btn">Cancel</button>
                <button type="button" id="btn-confirm-table-add-food" class="action-btn">Add to Plan</button>
            </div>
        </div>
    </div>

    <!-- Modular Table Scripts -->
    <script src="data-store.js?v=4"></script>
    <script src="nutrition-popover.js?v=4"></script>
    <script src="column-sort.js?v=4"></script>
    <script src="drag-drop.js?v=4"></script>
    <script src="table-renderer.js?v=4"></script>
    <script src="modals.js?v=4"></script>
    <script src="table.js?v=4"></script>
</body>

</html>
